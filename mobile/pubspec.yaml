name: your_mettings
description: "Мобильный помощник для обработки рабочих встреч."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_quill: ^11.6.0
  flutter_secure_storage: 11.1.0
  http: ^1.6.0
  markdown: ^7.3.1
  markdown_quill: ^4.3.0
  path_provider: ^2.1.6
  record: ^7.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/meeting_examples/
