[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yourmettings-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "tokenizers>=0.21,<0.23",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.setuptools.package-data]
app = ["prompts/*.txt", "examples/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database"]
